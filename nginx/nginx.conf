worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Docker DNS: имя сервиса резолвится на каждый запрос (кэш 5 с) и отдаёт IP всех реплик,
  # поэтому реплики можно добавлять и убирать без перезапуска nginx.
  # Так же nginx стартует, даже если профиль `bot` не запущен.
  resolver 127.0.0.11 valid=5s ipv6=off;

  # Host с портом нужен Next.js: Server Actions сверяют Origin и Host.
  proxy_set_header Host              $http_host;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $http_host;

  server {
    listen 3000;
    location / {
      set $upstream http://frontend:3000;
      proxy_pass $upstream;
    }
  }

  server {
    listen 8000;
    location / {
      set $upstream http://backend:8000;
      proxy_pass $upstream;
    }
  }

  # Вебхук Telegram. Наружу его нужно опубликовать по https (ngrok, cloudflared, ingress).
  server {
    listen 8081;
    location / {
      set $upstream http://bot:8080;
      proxy_pass $upstream;
    }
  }
}
