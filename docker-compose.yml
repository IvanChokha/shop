name: shop

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://shop:shop@db:5432/shop
  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_BUCKET: shop
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    # Оригинальный minio был удалён с Docker Hub 11 сентября 2026, поэтому используем форк с тем же S3 API,
    # переменными MINIO_* и форматом данных.
    image: pgsty/silo:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000" # S3 API: отсюда браузер берёт картинки и льёт файлы по presigned URL
      - "9001:9001" # веб-консоль
    volumes:
      - miniodata:/data

  # Одноразовая задача: миграции + бакет + демо-данные. Реплики API миграции не запускают.
  init:
    build: ./backend
    image: shop-backend
    command: sh -c "alembic upgrade head && python -m app.scripts.seed"
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    restart: "no"

  backend:
    build: ./backend
    image: shop-backend
    environment: *backend-env
    depends_on:
      init:
        condition: service_completed_successfully
    deploy:
      replicas: 2
    read_only: true # доказательство «без записи на диск»
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      - backend
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 5s
      timeout: 4s
      retries: 10

  # Балансировщик перед репликами: http://localhost:3000 (сайт), :8000 (API), :8081 (вебхук бота).
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3000:3000"
      - "8000:8000"
      - "8081:8081"
    depends_on:
      - frontend
      - backend

  # docker compose --profile bot up   (нужен BOT_TOKEN в .env)
  # 2+ реплики: BOT_MODE=webhook + WEBHOOK_BASE_URL, затем `up --scale bot=2`.
  bot:
    profiles: ["bot"]
    build: ./bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      BOT_MODE: ${BOT_MODE:-polling}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      CART_SECRET: ${CART_SECRET:-change-me-too}
      API_URL: http://backend:8000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      S3_INTERNAL_URL: http://minio:9000
    depends_on:
      - backend
    read_only: true
    tmpfs:
      - /tmp

volumes:
  pgdata:
  miniodata:
